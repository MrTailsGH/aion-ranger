name: Update character

on:
  schedule:
    - cron: "23 */4 * * *"   # every 4 hours
  workflow_dispatch: {}       # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: update-character
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch from the official armory
        run: node scripts/fetch.mjs
      - name: Commit if something changed
        run: |
          git config user.name "armory-bot"
          git config user.email "armory-bot@users.noreply.github.com"
          git add data.json history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update character data"
            git push
          fi
